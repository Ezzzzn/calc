<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href='calc.css'></link>
	<script src="script.js" defer></script>
</head>
<body>
	<div id="everything">
		<div class="earth">
			<div id="screen"></div>
			<div id="keys">
				<button class="button" onclick="yummyPie()">π</button>
				<button class="button" onclick="root()">√</button>
				<button class="button" onclick="squared()">𝑥²</button>
				<button class="button" onclick="changeOperation('^')">^</button>
				<button class="button" onclick="fullRemove()">AC</button>
				<button class="button" onclick="remove()">C</button>
				<button class="button" onclick="changeOperation('%')">%</button>
				<button class="button" onclick="changeOperation('÷')">÷</button>
				<button class="button" onclick="newDigit(7)">7</button>
				<button class="button" onclick="newDigit(8)">8</button>
				<button class="button" onclick="newDigit(9)">9</button>
				<button class="button" onclick="changeOperation('×')">×</button>
				<button class="button" onclick="newDigit(4)">4</button>
				<button class="button" onclick="newDigit(5)">5</button>
				<button class="button" onclick="newDigit(6)">6</button>
				<button class="button" onclick="changeOperation('-')">-</button>
				<button class="button" onclick="newDigit(1)">1</button>
				<button class="button" onclick="newDigit(2)">2</button>
				<button class="button" onclick="newDigit(3)">3</button>
				<button class="button" onclick="changeOperation('+')">+</button>
				<button class="button" onclick="backspace()">⌫</button>
				<button class="button" onclick="newDigit(0)">0</button>
				<button class="button" onclick="point()">.</button>
				<button class="button" onclick="equals()">=</button>
			</div>
		</div>
		<div class="dropdown">
		    <button class="dropbtn">Calc Types 
		      <i class="fa fa-caret-down"></i>
		    </button>
		    <div class="dropdown-content">
		      <button id="earth">Earth</button>
	    	  <button id="air">Air</button>
	    	  <button id="water">Water</button>
	    	  <button id="fire">Fire</button>
	    	</div>
	  	</div>
	</div>
</body>
</html>
